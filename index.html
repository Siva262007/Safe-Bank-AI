<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBank AI — Adaptive Fraud Protection Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#EDEFEA;
  --paper:#F5F6F2;
  --surface:#FFFFFF;
  --ink:#16233A;
  --ink-soft:#4B5768;
  --line:#D7DBD1;
  --line-strong:#B9C0B2;
  --primary:#1F3D5C;
  --primary-light:#2E5479;
  --primary-dim:#DCE4E9;
  --gold:#C7963A;
  --gold-dim:#F3E6C9;
  --low:#2E7D5B;
  --low-dim:#DDEDE4;
  --medium:#B8791E;
  --medium-dim:#F6E8D2;
  --high:#B23B2E;
  --high-dim:#F7DFDA;
  --font-head:'Space Grotesk', sans-serif;
  --font-body:'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
::selection{background:var(--gold-dim);}

/* ============ SHELL ============ */
.shell{
  max-width:1400px;
  margin:0 auto;
  padding:28px 24px 80px;
}
.masthead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:38px;height:38px;
  border-radius:9px;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:20px;height:20px;}
.brand-name{
  font-family:var(--font-head);
  font-weight:600;
  font-size:19px;
  letter-spacing:-0.01em;
}
.brand-sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:1px;
}
.view-switch{
  display:flex;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:999px;
  padding:4px;
  gap:2px;
}
.view-switch button{
  border:none;
  background:transparent;
  padding:9px 18px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  transition:background .18s ease, color .18s ease;
}
.view-switch button.active{
  background:var(--primary);
  color:#fff;
}
.reset-btn{
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-soft);
  padding:9px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
}
.reset-btn:hover{border-color:var(--primary);color:var(--primary);}

.stage{
  display:flex;
  gap:36px;
  align-items:flex-start;
  justify-content:center;
  flex-wrap:wrap;
}

/* ============ PHONE FRAME ============ */
.phone{
  width:390px;
  background:#0E1B2B;
  border-radius:46px;
  padding:14px;
  box-shadow:0 30px 60px -20px rgba(20,30,45,.35), 0 2px 0 rgba(255,255,255,.4) inset;
  flex-shrink:0;
}
.phone-notch{
  position:relative;
  height:26px;
}
.phone-notch::after{
  content:'';
  position:absolute;
  top:0;left:50%;
  transform:translateX(-50%);
  width:120px;height:20px;
  background:#0E1B2B;
  border-radius:0 0 16px 16px;
}
.phone-screen{
  background:var(--paper);
  border-radius:32px;
  overflow:hidden;
  height:730px;
  display:flex;
  flex-direction:column;
  position:relative;
}
.screen-scroll{
  flex:1;
  overflow-y:auto;
  -ms-overflow-style:none;
  scrollbar-width:none;
}
.screen-scroll::-webkit-scrollbar{display:none;}
.screen-pad{padding:22px 20px 28px;}

/* status bar */
.statusbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 22px 0;
  font-family:var(--font-head);
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  flex-shrink:0;
}

/* bottom tab bar */
.tabbar{
  display:flex;
  border-top:1px solid var(--line);
  background:var(--surface);
  padding:10px 6px 14px;
  flex-shrink:0;
}
.tabbar button{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border:none;background:transparent;
  font-size:10.5px;
  font-weight:600;
  color:var(--ink-soft);
  padding:4px 0;
  border-radius:10px;
}
.tabbar button.active{color:var(--primary);}
.tabbar svg{width:20px;height:20px;}

/* ============ TYPE ============ */
h1,h2,h3,h4{font-family:var(--font-head);margin:0;letter-spacing:-0.01em;}
.h-screen{font-size:21px;font-weight:600;}
.h-section{font-size:14.5px;font-weight:600;color:var(--ink);}
.eyebrow{font-size:12.5px;color:var(--ink-soft);}
.mono-num{font-family:var(--font-head);font-variant-numeric:tabular-nums;}
p{margin:0;line-height:1.5;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:13px;
  padding:14px 18px;
  font-weight:600;
  font-size:14.5px;
  border:none;
  width:100%;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-gold{background:var(--gold);color:#2A1D02;}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary-dim);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-danger-outline{background:transparent;color:var(--high);border:1.5px solid var(--high-dim);}
.btn-danger-outline:hover{border-color:var(--high);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:10px;}

/* ============ FORM ============ */
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  margin-bottom:6px;
}
.field input,.field textarea{
  width:100%;
  border:1.5px solid var(--line-strong);
  background:var(--surface);
  border-radius:12px;
  padding:12px 14px;
  font-size:14.5px;
  color:var(--ink);
  outline:none;
}
.field input:focus,.field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical;min-height:80px;}
.helper{font-size:12px;color:var(--ink-soft);margin-top:5px;}

/* toggle chip */
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1.5px solid var(--line-strong);
  background:var(--surface);
  border-radius:10px;
  padding:9px 12px;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  display:flex;align-items:center;gap:7px;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex-shrink:0;}
.chip.on{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);}
.chip.on .dot{background:var(--primary);}

/* card */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 18px;
}
.card + .card{margin-top:12px;}

/* ============ DASHBOARD ============ */
.balance-card{
  background:linear-gradient(155deg,var(--primary) 0%, #14283D 100%);
  color:#fff;
  border-radius:20px;
  padding:22px 20px;
  margin:16px 0 18px;
}
.balance-card .eyebrow{color:rgba(255,255,255,.68);}
.balance-amt{font-family:var(--font-head);font-size:32px;font-weight:600;margin-top:6px;letter-spacing:-0.02em;}
.protect-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  padding:5px 11px;
  font-size:11.5px;font-weight:600;
  margin-top:14px;
}
.protect-pill .dot{width:7px;height:7px;border-radius:50%;background:#4FD897;}

.quick-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;
}
.quick-btn{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px 14px;
  text-align:left;
  display:flex;flex-direction:column;gap:10px;
}
.quick-btn .qicon{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-dim);color:var(--primary);
}
.quick-btn span{font-size:13px;font-weight:600;}
.quick-btn svg{width:17px;height:17px;}

.activity-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.activity-row:last-child{border-bottom:none;}
.activity-left{display:flex;align-items:center;gap:11px;}
.activity-icon{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
.activity-name{font-size:13.5px;font-weight:600;}
.activity-time{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.activity-amt{font-family:var(--font-head);font-weight:600;font-size:14px;}

/* risk badges */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:999px;padding:5px 11px;
  font-size:12px;font-weight:700;
}
.badge-low{background:var(--low-dim);color:var(--low);}
.badge-medium{background:var(--medium-dim);color:var(--medium);}
.badge-high{background:var(--high-dim);color:var(--high);}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* risk result screens */
.risk-hero{
  border-radius:20px;
  padding:26px 22px;
  text-align:center;
  margin:6px 0 18px;
}
.risk-hero.low{background:var(--low-dim);}
.risk-hero.medium{background:var(--medium-dim);}
.risk-hero.high{background:var(--high-dim);}
.risk-hero .ring{
  width:96px;height:96px;border-radius:50%;
  margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);
  border:6px solid currentColor;
}
.risk-hero.low .ring{color:var(--low);}
.risk-hero.medium .ring{color:var(--medium);}
.risk-hero.high .ring{color:var(--high);}
.risk-hero .ring .score{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--ink);}
.risk-hero h2{font-size:19px;margin-bottom:6px;}
.risk-hero.low h2{color:var(--low);}
.risk-hero.medium h2{color:var(--medium);}
.risk-hero.high h2{color:var(--high);}
.risk-hero p{font-size:13px;color:var(--ink-soft);}

.factor-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;
  font-size:13px;
  border-bottom:1px solid var(--line);
}
.factor-row:last-child{border-bottom:none;}
.factor-row .flabel{display:flex;align-items:center;gap:8px;color:var(--ink);}
.factor-row .fval{font-family:var(--font-head);font-weight:600;color:var(--high);}

.stack-gap > * + *{margin-top:10px;}

/* scam scanner */
.scam-signal{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px 0;
  font-size:13px;
}
.scam-signal svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--high);}

/* safety center rows */
.safety-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
  font-weight:500;
}
.safety-row:last-child{border-bottom:none;}
.check-on{color:var(--low);display:flex;align-items:center;}
.check-on svg{width:18px;height:18px;}

.switch{
  width:42px;height:24px;border-radius:999px;
  background:var(--line-strong);
  position:relative;
  border:none;flex-shrink:0;
}
.switch.on{background:var(--low);}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  transition:left .16s ease;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.switch.on::after{left:21px;}

/* back / top nav within phone */
.topnav{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px 6px;
  flex-shrink:0;
}
.back-btn{
  width:32px;height:32px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.back-btn svg{width:16px;height:16px;}

/* user switcher pill on login/dashboard */
.user-toggle{
  display:flex;gap:8px;margin-bottom:18px;
}
.user-toggle button{
  flex:1;border:1.5px solid var(--line-strong);
  background:var(--surface);border-radius:12px;padding:10px;
  font-size:12px;font-weight:600;color:var(--ink-soft);text-align:left;
}
.user-toggle button.active{border-color:var(--gold);background:var(--gold-dim);color:#5C4109;}
.user-toggle .u-name{display:block;font-family:var(--font-head);font-size:13.5px;color:var(--ink);margin-bottom:1px;}

/* ============ LOGIN ============ */
.login-wrap{
  height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:0 26px;
}
.login-mark{
  width:60px;height:60px;border-radius:16px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
}
.login-mark svg{width:30px;height:30px;}
.login-title{text-align:center;font-size:22px;margin-bottom:4px;}
.login-sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:30px;}
.pin-dots{display:flex;gap:10px;justify-content:center;padding:6px 0;}
.pin-dots span{width:12px;height:12px;border-radius:50%;background:var(--line-strong);}
.pin-dots span.filled{background:var(--primary);}

/* ============ ADMIN DASHBOARD ============ */
.admin-wrap{
  width:100%;max-width:1020px;
  background:var(--surface);
  border-radius:22px;
  border:1px solid var(--line);
  overflow:hidden;
  box-shadow:0 20px 50px -25px rgba(20,30,45,.25);
}
.admin-head{
  background:var(--primary);
  color:#fff;
  padding:22px 28px;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:14px;
}
.admin-head h1{font-size:19px;}
.admin-head .eyebrow{color:rgba(255,255,255,.65);}
.admin-live{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.12);
  padding:6px 12px;border-radius:999px;
  font-size:12px;font-weight:600;
}
.admin-live .dot{width:7px;height:7px;border-radius:50%;background:#4FD897;animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.admin-body{padding:26px 28px 30px;}
.stat-strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  margin-bottom:26px;
}
.stat-cell{background:var(--surface);padding:18px 18px;}
.stat-cell .eyebrow{margin-bottom:6px;}
.stat-cell .num{font-family:var(--font-head);font-size:26px;font-weight:600;}
.stat-cell.low .num{color:var(--low);}
.stat-cell.medium .num{color:var(--medium);}
.stat-cell.high .num{color:var(--high);}

.admin-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:24px;align-items:start;}
@media (max-width:860px){.admin-grid{grid-template-columns:1fr;}.stat-strip{grid-template-columns:1fr 1fr;}}

.risk-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.risk-bar-label{width:78px;font-size:12.5px;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:6px;}
.risk-bar-track{flex:1;height:12px;background:var(--paper);border-radius:999px;overflow:hidden;}
.risk-bar-fill{height:100%;border-radius:999px;}
.risk-bar-num{width:56px;text-align:right;font-family:var(--font-head);font-size:12.5px;font-weight:600;flex-shrink:0;}

.alert-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 14px;border:1px solid var(--line);border-radius:13px;
  margin-bottom:9px;border-left:4px solid var(--line-strong);
  background:var(--surface);
}
.alert-item.risk-low{border-left-color:var(--low);}
.alert-item.risk-medium{border-left-color:var(--medium);}
.alert-item.risk-high{border-left-color:var(--high);}
.alert-item:hover{border-color:var(--primary-light);cursor:pointer;}
.alert-left{display:flex;flex-direction:column;gap:2px;}
.alert-amt{font-family:var(--font-head);font-weight:600;font-size:14.5px;}
.alert-meta{font-size:12px;color:var(--ink-soft);}
.alert-right{display:flex;align-items:center;gap:10px;}
.alert-score{font-family:var(--font-head);font-weight:700;font-size:15px;}

.detail-panel{margin-top:24px;border-top:2px dashed var(--line);padding-top:22px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin:16px 0 20px;}
.detail-kv{font-size:13px;}
.detail-kv .k{color:var(--ink-soft);font-size:11.5px;margin-bottom:2px;}
.detail-kv .v{font-weight:600;}
.action-banner{
  border-radius:14px;padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
}
.action-banner.low{background:var(--low-dim);color:var(--low);}
.action-banner.medium{background:var(--medium-dim);color:var(--medium);}
.action-banner.high{background:var(--high-dim);color:var(--high);}
.action-banner .big{font-family:var(--font-head);font-size:16px;font-weight:700;}

.close-x{border:none;background:rgba(255,255,255,.15);color:#fff;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.close-x svg{width:15px;height:15px;}

.empty-note{color:var(--ink-soft);font-size:13px;text-align:center;padding:26px 10px;}
.hint-banner{
  background:var(--gold-dim);color:#5C4109;border-radius:12px;padding:11px 13px;font-size:12.5px;margin-bottom:16px;line-height:1.45;
}
.demo-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.demo-row .btn-sm{flex:1;}
</style>
</head>
<body>

<div class="shell">
  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z" fill="#fff"/><path d="M9.5 12.2l1.8 1.8 3.4-3.6" stroke="#1F3D5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name">SafeBank AI</div>
        <div class="brand-sub">Adaptive fraud protection — hackathon prototype</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="view-switch">
        <button id="tab-customer" class="active">Customer App</button>
        <button id="tab-admin">Bank Admin</button>
      </div>
      <button class="reset-btn" id="reset-demo">Reset demo</button>
    </div>
  </div>

  <div class="stage">
    <div class="phone" id="phone-wrap">
      <div class="phone-notch"></div>
      <div class="phone-screen" id="phone-screen"></div>
    </div>
    <div class="admin-wrap" id="admin-wrap" style="display:none;"></div>
  </div>
</div>

<script>
/* ============================================================
   SAFEBANK AI — PROTOTYPE ENGINE
   Everything runs client-side. No data leaves the browser.
   ============================================================ */

/* ---------- ICONS ---------- */
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>',

/* ---------- RISK ENGINE ---------- */
function isNewBeneficiary(name){
  const u = currentUser();
  if(!name || !name.trim()) return false;
  return !u.beneficiaries.some(b => b.toLowerCase() === name.trim().toLowerCase());
}

function calcRisk(input){
  const u = currentUser();
  const factors = [];
  let risk = 0;

  const ratio = input.amount / u.normalAmount;
  if(ratio > 5){ risk += 25; factors.push(['Amount far above your usual range', 25]); }
  else if(ratio > 2){ risk += 13; factors.push(['Amount higher than your usual range', 13]); }

  if(input.newBeneficiary){ risk += 20; factors.push(['New beneficiary', 20]); }
  if(input.newDevice){ risk += 20; factors.push(['New / unrecognised device', 20]); }
  if(input.unusualLocation){ risk += 15; factors.push(['Unusual location', 15]); }
  if(input.unusualTime){ risk += 10; factors.push(['Unusual transaction time', 10]); }
  if(input.rapid){ risk += 10; factors.push(['Multiple transactions in quick succession', 10]); }

  risk = Math.min(risk, 100);

  // Adaptive protection: thresholds tighten for Enhanced-protection profiles.
  // NOTE: the raw risk score above never uses age — only transaction & device signals.
  // Protection level only changes where the intervention line sits.
  const enhanced = u.protection === 'Enhanced' && state.safetyToggles.adaptive;
  const warnAt = enhanced ? 24 : 31;
  const pauseAt = enhanced ? 58 : 71;

  let level, action;
  if(risk < warnAt){ level='low'; action='ALLOW'; }
  else if(risk < pauseAt){ level='medium'; action='WARN'; }
  else{ level='high'; action='PAUSE'; }

  return { risk, level, action, factors, thresholds:{warnAt, pauseAt}, enhanced };
}

/* ---------- SCAM SCANNER ---------- */
const URGENT = ['urgent','immediately','right away','today','now','last warning','act fast','expire','expires'];
const THREAT = ['blocked','suspend','suspended','deactivat','frozen','closed','close your account','legal action'];
const MONEY  = ['send money','send ₹','transfer','verify your account','otp','share your pin','click here','click the link','pay now','processing fee','refund','kyc update'];

function scanMessage(text){
  const t = text.toLowerCase();
  const hits = [];
  let score = 0;
  if(URGENT.some(w=>t.includes(w))){ hits.push('Urgent, pressuring language'); score += 25; }
  if(THREAT.some(w=>t.includes(w))){ hits.push('Threat of account closure or block'); score += 30; }
  if(MONEY.some(w=>t.includes(w))){ hits.push('Request for money, OTP or "verification"'); score += 30; }
  if(t.includes('http')||t.includes('www.')||t.includes('.link')||t.includes('bit.ly')){ hits.push('Suspicious link included'); score += 15; }
  if(/\b(bank|account)\b/.test(t) && (t.includes('verify')||t.includes('confirm'))){ hits.push('Impersonates a bank verification request'); score += 10; }
  score = Math.min(score, 99);
  if(hits.length===0 && text.trim().length>0) score = Math.max(score, 4);
  const level = score >= 60 ? 'high' : score >= 25 ? 'medium' : 'low';
  return { score, level, hits };
}

}

/* ---------- BIND: customer screen events ---------- */
const txnStore = { A: [...SEED_HISTORY.A], B: [...SEED_HISTORY.B] };

function bindScreen(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const t = b.dataset.nav;
    if(t==='__switch'){ state.loggedIn=false; state.screen='login'; renderPhone(); return; }
    state.screen = t;
    renderPhone();
  });

  const rEl = document.getElementById('f-recipient');
  const aEl = document.getElementById('f-account');
  const amEl = document.getElementById('f-amount');
  const mEl = document.getElementById('f-message');
  if(rEl){
    [ [rEl,'recipient'], [aEl,'account'], [amEl,'amount'], [mEl,'message'] ].forEach(([node,key])=>{
      node.addEventListener('input', e=>{ state.form[key]=e.target.value; });
    });
  }

  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const k = b.dataset.toggle;
    state.form[k] = !state.form[k];
    renderPhone();
  });

  document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{
    applyScenario(b.dataset.scenario);
  });

  const contBtn = document.getElementById('send-continue');
  if(contBtn) contBtn.onclick = submitSend;

  document.querySelectorAll('[data-safety]').forEach(b=>b.onclick=()=>{
    const k = b.dataset.safety;
    if(k==='trustedContact') return; // decorative in this screen
    state.safetyToggles[k] = !state.safetyToggles[k];
    renderPhone();
  });

  const scamText = document.getElementById('scam-text');
  if(scamText) scamText.addEventListener('input', e=>{ state.scamInput = e.target.value; });
  const scamExample = document.getElementById('scam-example');
  if(scamExample) scamExample.onclick = ()=>{
    state.scamInput = 'Your bank account will be blocked today. Send ₹10,000 immediately to verify your account and avoid suspension. Click here: bit.ly/verify-now';
    renderPhone();
  };
  const scamRun = document.getElementById('scam-run');
  if(scamRun) scamRun.onclick = ()=>{
    if(!state.scamInput.trim()) return;
    state.scamResult = scanMessage(state.scamInput);
    state.screen = 'scamResult';
    renderPhone();
  };
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action));
}

function applyScenario(n){
  const u = currentUser();
  if(n==='1'){
    state.form = { recipient:u.beneficiaries[0], account:u.beneficiaries[0].toLowerCase()+'@upi', amount:String(Math.round(u.normalAmount*0.4)), message:'', newDevice:false, unusualLocation:false, unusualTime:false, rapid:false };
  }else if(n==='2'){
    state.form = { recipient:'New Payee', account:'newpayee@upi', amount:String(u.normalAmount*7), message:'', newDevice:false, unusualLocation:false, unusualTime:false, rapid:false };
  }else if(n==='3'){
    state.form = { recipient:'Unknown', account:'unknown@upi', amount:String(u.normalAmount*25), message:'', newDevice:true, unusualLocation:true, unusualTime:true, rapid:true };
  }
  renderPhone();
}

function submitSend(){
  const f = state.form;
  const amount = Number(f.amount || 0);
  if(!amount){ alert('Enter an amount to continue.'); return; }
  const input = { amount, recipient:f.recipient||'Recipient', newBeneficiary:isNewBeneficiary(f.recipient), newDevice:f.newDevice, unusualLocation:f.unusualLocation, unusualTime:f.unusualTime, rapid:f.rapid };
  const r = calcRisk(input);
  r.input = input;
  state.lastResult = r;
  logTransaction(r);
  state.screen = 'result';
  renderPhone();
  renderAdmin();
}

function logTransaction(r){
  const u = currentUser();
  txnStore[state.userKey].unshift({ amt:r.input.amount, who:r.input.recipient, dir:'sent', when:'Just now', level:r.level });

  transactionLog.unshift({
    id: 'TXN_' + (txnSeq++),
    userLabel: u.name + ' (' + u.id + ')',
    amount: r.input.amount,
    receiver: r.input.recipient,
    risk: r.risk,
    level: r.level,
    time: new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}),
    device: r.input.newDevice ? 'New' : 'Known',
    location: r.input.unusualLocation ? 'Unusual' : 'Known',
    beneficiary: r.input.newBeneficiary ? 'NEW' : 'EXISTING',
    factors: r.factors,
    action: r.level==='high' ? 'TRANSACTION PAUSED' : r.level==='medium' ? 'WARNING ISSUED' : 'APPROVED'
  });
}

function handleAction(action){
  if(action==='verify-continue'){
    state.screen='dashboard';
    renderPhone();
  } else if(action==='cancel-txn'){
    state.screen='dashboard';
    renderPhone();
  } else if(action==='contact-bank'){
    alert('In a live app, this opens a secure call or chat with SafeBank support.');
  } else if(action==='report-scam' || action==='delete-scam'){
    state.scamInput=''; state.scamResult=null; state.screen='scam';
    renderPhone();
  }
}

          <div style="margin-top:16px;" class="card">
            <div class="factor-row"><div class="flabel">Fraud attempts blocked today</div><div class="fval" style="color:var(--high);">${fraudAttempts}</div></div>
            <div class="factor-row"><div class="flabel">Vulnerable-profile customers monitored</div><div class="fval" style="color:var(--ink);">1,204</div></div>

function riskBar(label, val, max, color){
  const pct = Math.round((val/max)*100);
  return `<div class="risk-bar-row">
    <div class="risk-bar-label"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;"></span>${label}</div>
    <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    <div class="risk-bar-num">${val.toLocaleString('en-IN')}</div>
  </div>`;
}

function alertRow(t){
  return `<div class="alert-item risk-${t.level}" data-txn="${t.id}">
    <div class="alert-left">
      <div class="alert-amt">${fmtINR(t.amount)}</div>
      <div class="alert-meta">${t.userLabel} · ${t.receiver}</div>
    </div>
    <div class="alert-right">
      <span class="badge badge-${t.level}"><span class="dot"></span>${t.risk}</span>
    </div>
  </div>`;
}

function bindAdmin(){
  document.querySelectorAll('[data-txn]').forEach(row=>row.onclick=()=>{
    state.adminSelected = row.dataset.txn;
    renderDetail(state.adminSelected);
  });
}

function renderDetail(id){
  const t = transactionLog.find(x=>x.id===id);
  const panel = document.getElementById('detail-panel');
  if(!t || !panel) return;
  const actionLabel = t.level==='high' ? 'TRANSACTION PAUSED' : t.level==='medium' ? 'WARNING ISSUED' : 'APPROVED';
  panel.innerHTML = `
    <div class="detail-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <div class="h-section">Transaction details — ${t.id}</div>
        <button class="close-x" style="background:var(--paper);color:var(--ink-soft);" id="detail-close">${ICONS.x}</button>
      </div>
      <div class="detail-grid">
        <div class="detail-kv"><div class="k">Customer</div><div class="v">${t.userLabel}</div></div>
        <div class="detail-kv"><div class="k">Amount</div><div class="v">${fmtINR(t.amount)}</div></div>
        <div class="detail-kv"><div class="k">Beneficiary</div><div class="v">${t.beneficiary}</div></div>
        <div class="detail-kv"><div class="k">Device</div><div class="v">${t.device}</div></div>
        <div class="detail-kv"><div class="k">Location</div><div class="v">${t.location}</div></div>
        <div class="detail-kv"><div class="k">Time</div><div class="v">${t.time}</div></div>
      </div>
      <div class="h-section" style="margin-bottom:8px;">AI risk analysis</div>
      <div class="card" style="margin-bottom:16px;">
        ${t.factors.map(f=>`<div class="factor-row"><div class="flabel">${f[0]}</div><div class="fval">+${f[1]}</div></div>`).join('')}
        <div class="factor-row" style="border-top:2px solid var(--line);margin-top:4px;padding-top:12px;">
          <div class="flabel" style="font-weight:700;font-family:var(--font-head);">Total risk score</div>
          <div class="fval" style="color:${levelColorVar(t.level)};font-size:17px;">${t.risk} / 100</div>
        </div>
      </div>
      <div class="action-banner ${t.level}">
        <div><div class="eyebrow" style="color:inherit;opacity:.75;">Action taken</div><div class="big">${actionLabel}</div></div>
        <span class="badge badge-${t.level}"><span class="dot"></span>${levelWord(t.level)}</span>
      </div>
    </div>
  `;
  document.getElementById('detail-close').onclick = ()=>{ state.adminSelected=null; panel.innerHTML=''; };
}

/* ============================================================
   TOP-LEVEL NAV / INIT
   ============================================================ */
document.getElementById('tab-customer').onclick = ()=>switchView('customer');
document.getElementById('tab-admin').onclick = ()=>switchView('admin');
document.getElementById('reset-demo').onclick = ()=>{
  if(!confirm('Reset the demo to its starting state?')) return;
  location.reload();
};

function switchView(v){
  state.view = v;
  document.getElementById('tab-customer').classList.toggle('active', v==='customer');
  document.getElementById('tab-admin').classList.toggle('active', v==='admin');
  document.getElementById('phone-wrap').style.display = v==='customer' ? 'block' : 'none';
  document.getElementById('admin-wrap').style.display = v==='admin' ? 'block' : 'none';
}

renderPhone();
renderAdmin();
switchView('customer');
</script>
